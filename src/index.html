<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Virtual Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/marzipano@0.10.2/dist/marzipano.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>


<body class="user">

  <!-- MINIMAP -->
  <div id="minimapWrapper" style="display: none;">
    <div id="minimapHeader">
      <span>🗺️ Sơ đồ tổng quan</span>
      <button id="minimapToggle" aria-label="Thu gọn/Mở rộng">−</button>
    </div>
    <div id="minimapContent">
      <div id="floorTabs" class="floor-tabs"></div>
      <div id="userMinimapContainer">
        <div id="minimapViewport">
          <div id="minimapLayer">
            <img id="userMinimapImage" draggable="false">
            <canvas id="userMinimapCanvas"></canvas>
          </div>
        </div>
        <div id="minimapZoomControls">
          <button id="minimapZoomOut" aria-label="Thu nhỏ">−</button>
          <span id="minimapZoomLabel">100%</span>
          <button id="minimapZoomIn" aria-label="Phóng to">+</button>
          <button id="minimapZoomReset" aria-label="Về mặc định">↺</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CỘT HUD BÊN TRÁI: ĐIỀU HƯỚNG PHÒNG & THIẾT BỊ IOT -->
  <div id="leftHudStack" class="left-hud-stack">
    <!-- DANH SÁCH PHÒNG -->
    <div id="roomListWrapper">
      <div id="buildingSelectWrapper" style="display:none">
        <label for="buildingSelect">🏢 Phân khu:</label>
        <select id="buildingSelect"></select>
      </div>
      <label for="roomSelect">📍 Chọn phòng:</label>
      <select id="roomSelect"></select>
    </div>

    <!-- BẢNG DANH SÁCH THIẾT BỊ IOT GIẢN LƯỢC (DIGITAL TWIN HUD) -->
    <div id="iotQuickListPanel" class="iot-quicklist-panel" aria-label="Danh sách thiết bị IoT">
      <div class="iot-quicklist-header">
        <div class="iot-quicklist-title-wrap">
          <span class="iot-quicklist-title">📡 Thiết bị IoT</span>
          <span id="iotQuickListCount" class="iot-quicklist-badge">0 thiết bị</span>
        </div>
        <button id="iotQuickListClose" class="iot-quicklist-close" aria-label="Đóng bảng thiết bị">×</button>
      </div>
      <div class="iot-quicklist-filters">
        <button class="iot-filter-chip active" data-filter="all">Tất cả</button>
        <button class="iot-filter-chip" data-filter="sensor">🌡️ Cảm biến</button>
        <button class="iot-filter-chip" data-filter="camera">📹 Camera</button>
      </div>
      <div id="iotQuickListItems" class="iot-quicklist-items"></div>
    </div>
  </div>

  <!-- AUTO TOUR CONTROL -->
  <div id="autoTourControl" class="auto-tour-control">
    <!-- Start Button (shown when tour is not active) -->
    <button id="autoTourStartBtn" class="auto-tour-btn" aria-label="Bắt đầu tham quan tự động">
      <span class="tour-icon">▶</span>
      <span class="tour-text">Tham quan tự động</span>
    </button>

    <!-- Control Panel (shown during tour) -->
    <div id="tourControlPanel" class="tour-control-panel" style="display: none;">
      <div class="tour-controls">
        <button id="tourPlayPauseBtn" class="tour-control-btn" aria-label="Tạm dừng/Tiếp tục">
          <span class="control-icon">⏸</span>
        </button>
        <button id="tourPrevBtn" class="tour-control-btn" aria-label="Điểm trước">
          <span class="control-icon">⏮</span>
        </button>
        <button id="tourNextBtn" class="tour-control-btn" aria-label="Điểm tiếp theo">
          <span class="control-icon">⏭</span>
        </button>
        <button id="tourRestartBtn" class="tour-control-btn" aria-label="Bắt đầu lại">
          <span class="control-icon">🔄</span>
        </button>
        <button id="tourStopBtn" class="tour-control-btn stop" aria-label="Dừng tour">
          <span class="control-icon">⏹</span>
        </button>
      </div>
      <div id="tourProgress" class="tour-progress">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <span id="tourStatus" class="tour-status">Đang tham quan...</span>
      </div>
    </div>
  </div>

  <!-- COMPASS OVERLAY -->
  <div id="compassContainer">
    <canvas id="compassCanvas" width="160" height="160"></canvas>
  </div>

  <!-- ZOOM CONTROL -->
  <div id="zoomControl" class="zoom-control">
    <div class="zoom-label-group">
      <svg class="zoom-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <span class="zoom-label">Zoom</span>
    </div>
    <input type="range" id="zoomSlider" min="30" max="110" value="75" class="zoom-slider" aria-label="Điều chỉnh độ thu phóng góc nhìn">
    <div class="zoom-value-badge">
      <span id="zoomValue">75</span>°
    </div>
    <button id="zoomResetBtn" class="zoom-reset-btn" type="button" aria-label="Đặt lại góc nhìn mặc định (75°)" title="Đặt lại góc nhìn mặc định (75°)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>

  <!-- MEDIA OVERLAY -->
  <div id="mediaOverlay" class="media-overlay hidden">
    <div class="overlay-header">
      <h3 id="mediaOverlayTitle">Tư liệu</h3>
      <button id="mediaOverlayClose" class="close-btn" aria-label="Đóng">×</button>
    </div>
    <p id="mediaOverlayDescription" style="display: none; margin: 8px 0; color: #d7d7d7; font-size: 12px;"></p>
    <div id="mediaOverlayContent" class="overlay-content"></div>
    <a id="mediaOverlayLink" href="#" target="_blank" class="overlay-link" style="display: none;">
      🔗 Mở trong tab mới
    </a>
  </div>

  <!-- CAMERA MODAL -->
  <div id="cameraModal" class="camera-modal hidden">
    <div class="camera-modal-backdrop"></div>
    <div class="camera-modal-content">
      <div class="camera-modal-header">
        <h2 id="cameraModalTitle">📹 Camera</h2>
        <button id="cameraModalClose" class="camera-modal-close" aria-label="Đóng">×</button>
      </div>
      <div class="camera-modal-body">
        <div id="cameraPreviewContainer" style="text-align: center;">
          <div style="padding: 40px; color: #999;">Đang tải camera...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SENSOR WIDGET REMOVED -->

  <!-- CAMERA PANEL -->
  <div id="cameraPanel" class="camera-panel hidden">
    <div class="camera-panel-header">
      <h3>📹 Camera</h3>
      <button id="cameraPanelToggle" class="camera-panel-toggle" aria-label="Thu gọn">−</button>
    </div>
    <div id="cameraPanelContent" class="camera-panel-content">
      <div style="text-align: center; padding: 20px; color: #999; font-size: 12px;">
        Không có camera
      </div>
    </div>
  </div>

  <!-- TOOLS MENU (DIGITAL TWIN 360 HUD DOCK) -->
  <div id="mailToolbox" class="tools-menu">
    <div class="tools-menu-trigger" aria-label="Menu công cụ không gian 360">
      <!-- 3D Spatial Twin Cube Icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    </div>
    <div class="tools-menu-dropdown">
      <!-- Nút xem danh sách thiết bị IoT 360 -->
      <div id="iotListToggleBtn" class="iot-list-btn" aria-label="Danh sách thiết bị IoT" data-tooltip="Thiết bị IoT 360">
        <!-- IoT Microchip / Telemetry Sensor Nodes Icon -->
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/>
          <rect x="9" y="9" width="6" height="6"/>
          <line x1="9" y1="1" x2="9" y2="4"/>
          <line x1="15" y1="1" x2="15" y2="4"/>
          <line x1="9" y1="20" x2="9" y2="23"/>
          <line x1="15" y1="20" x2="15" y2="23"/>
          <line x1="20" y1="9" x2="23" y2="9"/>
          <line x1="20" y1="14" x2="23" y2="14"/>
          <line x1="1" y1="9" x2="4" y2="9"/>
          <line x1="1" y1="14" x2="4" y2="14"/>
        </svg>
      </div>
      <div id="mailDragIcon" class="mail-drag-icon" draggable="true" aria-label="Kéo hoặc click để tạo điểm mail" data-tooltip="Tạo điểm Mail 360">
        <!-- Spatial Annotation / Mail Icon -->
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <a href="/admin/index.html" class="dashboard-btn" aria-label="Quay về Dashboard" data-tooltip="Bảng điều khiển Trung tâm" style="display: none;">
        <!-- Digital Twin Telemetry Grid Dashboard Icon -->
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="9" x="3" y="3" rx="1"/>
          <rect width="7" height="5" x="14" y="3" rx="1"/>
          <rect width="7" height="9" x="14" y="12" rx="1"/>
          <rect width="7" height="5" x="3" y="16" rx="1"/>
        </svg>
      </a>
      <div id="userProfileTourBtn" class="tour-profile-btn" aria-label="Thông tin tài khoản" data-tooltip="Hồ sơ Chuyên viên" style="display: none;">
        <!-- Operator ID Profile Icon -->
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div id="tourLogoutBtn" class="tour-logout-btn" aria-label="Đăng xuất" data-tooltip="Ngắt kết nối / Đăng xuất" style="display: none;">
        <!-- System Exit / Disconnect Icon -->
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- MAIL COMPOSER PANEL -->
  <div id="mailComposerPanel" class="mail-composer hidden">
    <div class="mail-composer-header">
      <h3 id="mailComposerTitle">✉️ Gửi mail</h3>
      <button id="mailComposerClose" class="mail-composer-close" aria-label="Đóng">×</button>
    </div>

    <label for="mailPointTitle">Tên điểm mail</label>
    <input id="mailPointTitle" type="text" placeholder="Ví dụ: Hỗ trợ khách tham quan">

    <label for="mailRecipientSelect">Chọn người nhận đã lưu</label>
    <select id="mailRecipientSelect">
      <option value="">-- Chọn hoặc nhập mới --</option>
    </select>

    <label for="mailRecipientInput">Email người nhận</label>
    <input id="mailRecipientInput" type="email" placeholder="example@email.com">

    <label for="mailSubjectInput">Tiêu đề</label>
    <input id="mailSubjectInput" type="text" placeholder="Tiêu đề mail">

    <label for="mailBodyInput">Nội dung mail</label>
    <textarea id="mailBodyInput" rows="5" placeholder="Nhập nội dung mail..."></textarea>

    <div id="mailComposerStatus" class="mail-composer-status"></div>

    <div class="mail-composer-actions">
      <button id="mailSaveBtn" class="mail-btn">💾 Lưu</button>
      <button id="mailSendBtn" class="mail-btn">📤 Gửi</button>
      <button id="mailDeleteBtn" class="mail-btn danger">🗑 Xóa</button>
    </div>
  </div>

  <!-- TOUR -->
  <div id="pano">
    <!-- SVG Overlay for 3D Highlights -->
    <svg id="polygonOverlay"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></svg>
  </div>

  <script src="/js/admin-runtime-config.js"></script>
  <script src="/js/admin-api-base.js"></script>
  <script type="module" src="/main.js"></script>
</body>

</html>
