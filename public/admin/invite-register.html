<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản từ Lời mời — Virtual Tour Qi</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="/js/auth-guard.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      color: var(--text-main);
      padding: 20px 0;
    }

    .register-container {
      width: 100%;
      max-width: 480px;
      padding: 15px;
    }

    .register-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .logo-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    .logo-box svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-control {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
    }

    .form-control:focus {
      background-color: rgba(15, 23, 42, 0.8);
      border-color: var(--primary-color);
      color: var(--text-main);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .form-control[readonly] {
      background-color: rgba(15, 23, 42, 0.3);
      color: #94a3b8;
      border-color: rgba(255, 255, 255, 0.05);
    }

    .form-label {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }

    .alert {
      border-radius: 10px;
      font-size: 14px;
    }

    .role-badge {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-card">
      <div class="logo-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        </svg>
      </div>

      <h1 class="title">Đăng ký Tài khoản mới</h1>
      <p class="subtitle" id="subtitleText">Đang xác thực đường link lời mời...</p>

      <!-- Alert -->
      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <!-- Form (Hidden until token verified) -->
      <form id="inviteRegisterForm" class="d-none">
        <div class="mb-3">
          <label class="form-label">Tài khoản đăng ký (Email của bạn)</label>
          <div class="d-flex align-items-center justify-content-between">
            <input type="email" id="emailInput" class="form-control me-2" readonly style="font-weight: 600; color: #a5b4fc;">
            <span class="role-badge" id="roleBadge">USER</span>
          </div>
          <small class="text-muted" style="font-size: 12px; display: block; margin-top: 4px;">🔒 Email này được cố định dùng làm Tên đăng nhập và không thể thay đổi.</small>
        </div>

        <div class="mb-3">
          <label for="displayName" class="form-label">Tên hiển thị</label>
          <input type="text" class="form-control" id="displayName" placeholder="Ví dụ: Nguyễn Văn A">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Hoàn tất Đăng ký</button>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const alertBox = document.getElementById('alertBox');
    const subtitleText = document.getElementById('subtitleText');
    const form = document.getElementById('inviteRegisterForm');
    const emailInput = document.getElementById('emailInput');
    const roleBadge = document.getElementById('roleBadge');
    const submitBtn = document.getElementById('submitBtn');

    async function verifyToken() {
      if (!token) {
        subtitleText.textContent = 'Lỗi truy cập';
        showAlert('Đường link thiếu mã xác thực (token). Vui lòng kiểm tra lại link trong Email.');
        return;
      }

      try {
        const res = await fetch(`/api/auth/invitations/verify?token=${encodeURIComponent(token)}`);
        const data = await res.json();

        if (!data.success) {
          subtitleText.textContent = 'Lời mời không khả dụng';
          showAlert(data.error || 'Link lời mời không hợp lệ hoặc đã hết hạn.');
          return;
        }

        // Valid token
        subtitleText.textContent = 'Bạn đã được mời khởi tạo tài khoản trên Virtual Tour';
        emailInput.value = data.invitation.email;
        roleBadge.textContent = (data.invitation.role || 'user').toUpperCase();
        form.classList.remove('d-none');
      } catch (err) {
        console.error('Verify error:', err);
        showAlert('Không thể kết nối đến máy chủ. Vui lòng thử lại sau.');
      }
    }

    function showAlert(msg, isSuccess = false) {
      alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'}`;
      alertBox.textContent = msg;
      alertBox.classList.remove('d-none');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');

      const displayName = document.getElementById('displayName').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Mật khẩu nhập lại không khớp!');
        return;
      }

      if (password.length < 6) {
        showAlert('Mật khẩu phải chứa ít nhất 6 ký tự!');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang xử lý...';

      try {
        const res = await fetch('/api/auth/invitations/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, displayName })
        });

        const data = await res.json();

        if (!data.success) {
          showAlert(data.error || 'Đăng ký thất bại!');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Hoàn tất Đăng ký';
          return;
        }

        showAlert('Đăng ký tài khoản thành công! Đang chuyển hướng đến trang Đăng nhập...', true);
        setTimeout(() => {
          window.location.href = '/admin/login.html';
        }, 2000);
      } catch (err) {
        console.error('Submit error:', err);
        showAlert('Có lỗi xảy ra khi kết nối máy chủ.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Hoàn tất Đăng ký';
      }
    });

    verifyToken();
  </script>
</body>
</html>
