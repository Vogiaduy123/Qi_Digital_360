# MediaMTX config for RTSP -> WebRTC (WHEP)
# Run MediaMTX in this folder and it will expose WHEP endpoint on port 8889.

logLevel: info

# REST API for dynamic stream path management
api: yes
apiAddress: :9997

# WebRTC (WHEP/WHIP) listener
webrtc: yes
webrtcAddress: :8889

paths:
  cam101:
    source: rtsp://admin:admin@192.168.1.126:554/unicaststream/2
    rtspTransport: tcp
    sourceOnDemand: yes
